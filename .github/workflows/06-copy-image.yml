# Manual: copy image env-1 → env-2 with crane (no rebuild).
# Run from Actions → 6. Copy image → Run workflow.
# Uses repo variable AWS_ROLE_ARN_COPY (OIDC). Does not run on PR/merge.

name: 6. Copy image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to copy from env-1 (prefer Release tag e.g. v1.2.3; empty = short git SHA)
        type: string
        required: false
        default: ""
      also_latest:
        description: Also tag the copy as latest on env-2
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: copy-image-env-2
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  SRC_REPO: branch-protection-env-1
  DEST_REPO: branch-protection-env-2

jobs:
  copy:
    name: Crane copy to env-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_COPY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve tag and refs
        id: meta
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git rev-parse --short HEAD)"
          fi
          SRC="${REGISTRY}/${SRC_REPO}:${TAG}"
          DEST="${REGISTRY}/${DEST_REPO}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "src=${SRC}" >> "$GITHUB_OUTPUT"
          echo "dest=${DEST}" >> "$GITHUB_OUTPUT"
          echo "dest_latest=${REGISTRY}/${DEST_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Copy image with crane
        run: |
          set -euo pipefail
          echo "Copying ${{ steps.meta.outputs.src }} -> ${{ steps.meta.outputs.dest }}"
          crane copy "${{ steps.meta.outputs.src }}" "${{ steps.meta.outputs.dest }}"
          if [ "${{ inputs.also_latest }}" = "true" ]; then
            echo "Also tagging ${{ steps.meta.outputs.dest_latest }}"
            crane copy "${{ steps.meta.outputs.src }}" "${{ steps.meta.outputs.dest_latest }}"
          fi

      - name: Summary
        run: |
          echo "### Copied image (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ steps.meta.outputs.src }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dest: \`${{ steps.meta.outputs.dest }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.also_latest }}" = "true" ]; then
            echo "- Dest latest: \`${{ steps.meta.outputs.dest_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
