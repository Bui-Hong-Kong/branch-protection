# Pre-merge quality gates with widely adopted language tooling.
# Job names are stable (no matrix in the check name) for GitHub rulesets.
#
#   Java       â†’ Checkstyle + SpotBugs (+ Maven package) on JDK 8
#   Go         → setup-go + go.mod, golangci-lint + go build
#   JavaScript â†’ ESLint (frontend/)
#
# Merge queue does not re-run these jobs.

name: 3. Pre-merge checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_SERVICES: carts orders shipping

jobs:
  lint-java:
    name: Lint (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            backend/carts/pom.xml
            backend/orders/pom.xml
            backend/shipping/pom.xml

      - name: Checkstyle + SpotBugs (each Java service)
        run: |
          set -euo pipefail
          CHECKSTYLE_CFG="$GITHUB_WORKSPACE/.github/linters/checkstyle.xml"
          for svc in $JAVA_SERVICES; do
            echo "::group::Lint Java â€” ${svc}"
            cd "$GITHUB_WORKSPACE/backend/${svc}"
            mvn -B -DskipTests package
            mvn -B org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check \
              -Dcheckstyle.config.location="$CHECKSTYLE_CFG" \
              -Dcheckstyle.consoleOutput=true \
              -Dcheckstyle.failsOnError=true
            mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.2.3:check \
              -Dspotbugs.failOnError=true \
              -Dspotbugs.effort=Default \
              -Dspotbugs.threshold=High \
              -Dspotbugs.xmlOutput=false
            echo "::endgroup::"
          done

  lint-go:
    name: Lint (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            backend/catalogue/go.sum
            backend/payment/go.sum
            backend/user/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend/catalogue
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: golangci-lint (payment)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend/payment
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: golangci-lint (user)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend/user
          args: --config=${{ github.workspace }}/.golangci.yml

  lint-javascript:
    name: Lint (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save eslint@8.57.1
          npx eslint . --max-warnings 0

  build-javascript:
    name: Build (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Yarn install (frontend)
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Docker build frontend (verify Dockerfile.ci)
        run: |
          set -euo pipefail
          docker build -f frontend/Dockerfile.ci -t sockshop-frontend:ci frontend

  build-java:
    name: Build (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            backend/carts/pom.xml
            backend/orders/pom.xml
            backend/shipping/pom.xml

      - name: Maven package (all Java services)
        run: |
          set -euo pipefail
          for svc in $JAVA_SERVICES; do
            echo "::group::Build Java â€” ${svc}"
            mvn -B -DskipTests package -f "backend/${svc}/pom.xml"
            echo "::endgroup::"
          done

  build-go:
    name: Build (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            backend/catalogue/go.sum
            backend/payment/go.sum
            backend/user/go.sum

      - name: Go build
        run: |
          set -euo pipefail
          echo "::group::catalogue"
          (cd backend/catalogue && CGO_ENABLED=0 go build -o app ./cmd/cataloguesvc)
          echo "::endgroup::"
          echo "::group::payment"
          (cd backend/payment && CGO_ENABLED=0 go build -o app ./cmd/paymentsvc)
          echo "::endgroup::"
          echo "::group::user"
          (cd backend/user && CGO_ENABLED=0 go build -o app .)
          echo "::endgroup::"
