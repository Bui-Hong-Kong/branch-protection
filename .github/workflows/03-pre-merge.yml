# Pre-merge quality gates with widely adopted language tooling.
# Job names are stable (no matrix in the check name) for GitHub rulesets.
#
#   Java       â†’ Checkstyle + SpotBugs (+ Maven package) on JDK 8
#   Go         â†’ gvt/glide restore (with gopkg.in remaps), then golangci-lint + go build
#   JavaScript â†’ ESLint (frontend/)
#
# Merge queue does not re-run these jobs.

name: 3. Pre-merge checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_SERVICES: carts orders shipping

jobs:
  lint-java:
    name: Lint (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            backend/carts/pom.xml
            backend/orders/pom.xml
            backend/shipping/pom.xml

      - name: Checkstyle + SpotBugs (each Java service)
        run: |
          set -euo pipefail
          CHECKSTYLE_CFG="$GITHUB_WORKSPACE/.github/linters/checkstyle.xml"
          for svc in $JAVA_SERVICES; do
            echo "::group::Lint Java â€” ${svc}"
            cd "$GITHUB_WORKSPACE/backend/${svc}"
            mvn -B -DskipTests package
            mvn -B org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check \
              -Dcheckstyle.config.location="$CHECKSTYLE_CFG" \
              -Dcheckstyle.consoleOutput=true \
              -Dcheckstyle.failsOnError=true
            mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.2.3:check \
              -Dspotbugs.failOnError=true \
              -Dspotbugs.effort=Default \
              -Dspotbugs.threshold=High \
              -Dspotbugs.xmlOutput=false
            echo "::endgroup::"
          done

  lint-go:
    name: Lint (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore deps + golangci-lint
        run: |
          set -euo pipefail
          LINT_IMAGE="golangci/golangci-lint:v1.51.2"
          REWRITES="/scripts/gopath-git-rewrites.sh"

          restore_gvt() {
            local svc="$1" root="$2"
            echo "::group::Restore Go deps â€” ${svc}"
            dest="$GITHUB_WORKSPACE/.gopath/src/${root}"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -a "$GITHUB_WORKSPACE/backend/${svc}" "$dest"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/.gopath:/go" \
              -v "$GITHUB_WORKSPACE/.github/scripts/gopath-git-rewrites.sh:${REWRITES}:ro" \
              -e GO111MODULE=off \
              -e GOPATH=/go \
              golang:1.17 \
              bash -c "bash ${REWRITES} && go get github.com/FiloSottile/gvt && cd /go/src/${root} && gvt restore"
            echo "::endgroup::"
          }

          restore_user() {
            local svc="$1" root="$2"
            echo "::group::Restore Go deps — ${svc}"
            dest="$GITHUB_WORKSPACE/.gopath/src/${root}"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -a "$GITHUB_WORKSPACE/backend/${svc}" "$dest"
            # Glide hits gopkg.in (502); seed mirrors + go get instead.
            docker run --rm \
              -v "$GITHUB_WORKSPACE/.gopath:/go" \
              -v "$GITHUB_WORKSPACE/.github/scripts/gopath-git-rewrites.sh:${REWRITES}:ro" \
              -e GO111MODULE=off \
              -e GOPATH=/go \
              golang:1.17 \
              bash -c "bash ${REWRITES} && cd /go/src/${root} && go get -d ./..."
            echo "::endgroup::"
          }

          lint_one() {
            local svc="$1" root="$2"
            echo "::group::Lint Go â€” ${svc}"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/.gopath:/go" \
              -v "$GITHUB_WORKSPACE/.golangci.yml:/golangci.yml:ro" \
              -e GO111MODULE=off \
              -e CGO_ENABLED=0 \
              -e GOPATH=/go \
              -w "/go/src/${root}" \
              "$LINT_IMAGE" \
              golangci-lint run --config /golangci.yml ./...
            echo "::endgroup::"
          }

          restore_gvt catalogue github.com/microservices-demo/catalogue
          lint_one catalogue github.com/microservices-demo/catalogue
          restore_gvt payment github.com/microservices-demo/payment
          lint_one payment github.com/microservices-demo/payment
          restore_user user github.com/microservices-demo/user
          lint_one user github.com/microservices-demo/user

  lint-javascript:
    name: Lint (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save eslint@8.57.1
          npx eslint . --max-warnings 0

  build-javascript:
    name: Build (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Yarn install (frontend)
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Docker build frontend (verify Dockerfile.ci)
        run: |
          set -euo pipefail
          docker build -f frontend/Dockerfile.ci -t sockshop-frontend:ci frontend

  build-java:
    name: Build (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            backend/carts/pom.xml
            backend/orders/pom.xml
            backend/shipping/pom.xml

      - name: Maven package (all Java services)
        run: |
          set -euo pipefail
          for svc in $JAVA_SERVICES; do
            echo "::group::Build Java â€” ${svc}"
            mvn -B -DskipTests package -f "backend/${svc}/pom.xml"
            echo "::endgroup::"
          done

  build-go:
    name: Build (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go build (restore deps then compile)
        run: |
          set -euo pipefail
          REWRITES="/scripts/gopath-git-rewrites.sh"
          build_gvt() {
            local service="$1" go_pkg="$2" go_root="$3"
            echo "::group::Build Go â€” ${service}"
            SRC_DIR="$GITHUB_WORKSPACE/backend/${service}"
            GOPATH_SRC="$GITHUB_WORKSPACE/.gopath/src/${go_root}"
            mkdir -p "$(dirname "$GOPATH_SRC")"
            rm -rf "$GOPATH_SRC"
            cp -a "$SRC_DIR" "$GOPATH_SRC"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/.gopath:/go" \
              -v "$GITHUB_WORKSPACE/.github/scripts/gopath-git-rewrites.sh:${REWRITES}:ro" \
              -e GO111MODULE=off \
              -e CGO_ENABLED=0 \
              -e GOPATH=/go \
              golang:1.17 \
              bash -c "bash ${REWRITES} && go get github.com/FiloSottile/gvt && cd /go/src/${go_root} && gvt restore && go build -o /go/src/${go_root}/app ${go_pkg}"
            test -f "$GOPATH_SRC/app"
            echo "::endgroup::"
          }
          build_user() {
            local service="$1" go_pkg="$2" go_root="$3"
            echo "::group::Build Go — ${service}"
            SRC_DIR="$GITHUB_WORKSPACE/backend/${service}"
            GOPATH_SRC="$GITHUB_WORKSPACE/.gopath/src/${go_root}"
            mkdir -p "$(dirname "$GOPATH_SRC")"
            rm -rf "$GOPATH_SRC"
            cp -a "$SRC_DIR" "$GOPATH_SRC"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/.gopath:/go" \
              -v "$GITHUB_WORKSPACE/.github/scripts/gopath-git-rewrites.sh:${REWRITES}:ro" \
              -e GO111MODULE=off \
              -e CGO_ENABLED=0 \
              -e GOPATH=/go \
              golang:1.17 \
              bash -c "bash ${REWRITES} && cd /go/src/${go_root} && go get -d ./... && go build -o /go/src/${go_root}/app ${go_pkg}"
            test -f "$GOPATH_SRC/app"
            echo "::endgroup::"
          }
          build_gvt catalogue \
            github.com/microservices-demo/catalogue/cmd/cataloguesvc \
            github.com/microservices-demo/catalogue
          build_gvt payment \
            github.com/microservices-demo/payment/cmd/paymentsvc \
            github.com/microservices-demo/payment
          build_user user \
            github.com/microservices-demo/user \
            github.com/microservices-demo/user
