# CodeQL on PRs and main: Go + JavaScript only.
# Java CodeQL lives in 01b-code-scan-java.yml (main / manual) so PRs are not
# blocked waiting for a skipped Analyze (java) SARIF upload.

name: 1. Code scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: code-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Analyze (go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            backend/catalogue/go.sum
            backend/payment/go.sum
            backend/user/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          config-file: .github/codeql/codeql-config.yml

      - name: Build Go services
        run: |
          set -euo pipefail
          echo "::group::catalogue"
          (cd backend/catalogue && go build -o app ./cmd/cataloguesvc)
          echo "::endgroup::"
          echo "::group::payment"
          (cd backend/payment && go build -o app ./cmd/paymentsvc)
          echo "::endgroup::"
          echo "::group::user"
          (cd backend/user && go build -o app .)
          echo "::endgroup::"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

  javascript:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
