# Manual: promote one service image env-1 (dev) → env-2 (UAT) with crane (no rebuild).
# Uses repo variable AWS_ROLE_ARN_COPY (OIDC). GitHub Environment: env-2.
# ECR: sockshop-<service>-env-1 → sockshop-<service>-env-2

name: 6. Promote image to UAT

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service image to promote to UAT
        type: choice
        required: true
        options:
          - carts
          - catalogue
          - orders
          - payment
          - shipping
          - user
          - frontend
      image_tag:
        description: Tag to promote (empty = newest <service>-v* release → stripped to vX.Y.Z)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-image-uat-${{ inputs.service }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  promote:
    name: Promote ${{ inputs.service }} → UAT
    runs-on: ubuntu-latest
    environment: env-2
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_COPY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve tag and refs
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          SRC_REPO="sockshop-${SERVICE}-env-1"
          DEST_REPO="sockshop-${SERVICE}-env-2"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            REL="$(gh api "repos/${{ github.repository }}/releases" --jq \
              "[.[] | select(.tag_name | startswith(\"${SERVICE}-v\")) | .tag_name][0]" 2>/dev/null || true)"
            if [ -n "$REL" ] && [ "$REL" != "null" ]; then
              prefix="${SERVICE}-"
              TAG="${REL#"$prefix"}"
              echo "Resolved from release ${REL} → tag ${TAG}"
            fi
          fi
          if [ -z "$TAG" ]; then
            TAG="$(git rev-parse --short HEAD)"
            echo "No ${SERVICE}-v* release tag found; using short SHA ${TAG}"
          fi
          SRC="${REGISTRY}/${SRC_REPO}:${TAG}"
          DEST="${REGISTRY}/${DEST_REPO}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "src=${SRC}" >> "$GITHUB_OUTPUT"
          echo "dest=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Promote image with crane
        run: |
          set -euo pipefail
          echo "Promoting ${{ steps.meta.outputs.src }} -> ${{ steps.meta.outputs.dest }}"
          crane copy "${{ steps.meta.outputs.src }}" "${{ steps.meta.outputs.dest }}"

      - name: Summary
        run: |
          echo "### Promoted image → UAT (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${{ inputs.service }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source (dev / env-1): \`${{ steps.meta.outputs.src }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dest (UAT / env-2): \`${{ steps.meta.outputs.dest }}\`" >> "$GITHUB_STEP_SUMMARY"
