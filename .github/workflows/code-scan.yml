# CodeQL on pull requests, and on main so the default-branch baseline
# stays javascript-only (avoids Neutral "configuration not found" for old /language:go).

name: Code scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: code-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
