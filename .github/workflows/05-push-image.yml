# Manual: build one Sock Shop service image and push to ECR env-1.
# Compile steps live in this workflow; runtime Dockerfile.ci (or service Dockerfile for DBs).
# Uses repo variable AWS_ROLE_ARN_PUSH (OIDC). Promote via 6. Copy image.
# ECR repo name: sockshop-<service>-env-1

name: 5. Push image

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and push
        type: choice
        required: true
        options:
          - carts
          - catalogue
          - orders
          - payment
          - shipping
          - user
          - frontend
      image_tag:
        description: Image tag (empty = latest <service>-v* Git tag, else short SHA)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: push-image-${{ inputs.service }}-env-1
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  push:
    name: Build and push ${{ inputs.service }} (env-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve service build params
        id: svc
        run: |
          set -euo pipefail
          SERVICE="${{ inputs.service }}"
          case "$SERVICE" in
            carts|orders|shipping)
              echo "stack=java" >> "$GITHUB_OUTPUT"
              echo "context=backend/${SERVICE}" >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/${SERVICE}/Dockerfile.ci" >> "$GITHUB_OUTPUT"
              ;;
            catalogue)
              echo "stack=go" >> "$GITHUB_OUTPUT"
              echo "go_pkg=github.com/microservices-demo/catalogue/cmd/cataloguesvc" >> "$GITHUB_OUTPUT"
              echo "go_root=github.com/microservices-demo/catalogue" >> "$GITHUB_OUTPUT"
              echo "context=backend/catalogue" >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/catalogue/Dockerfile.ci" >> "$GITHUB_OUTPUT"
              ;;
            payment)
              echo "stack=go" >> "$GITHUB_OUTPUT"
              echo "go_pkg=github.com/microservices-demo/payment/cmd/paymentsvc" >> "$GITHUB_OUTPUT"
              echo "go_root=github.com/microservices-demo/payment" >> "$GITHUB_OUTPUT"
              echo "context=backend/payment" >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/payment/Dockerfile.ci" >> "$GITHUB_OUTPUT"
              ;;
            user)
              echo "stack=go" >> "$GITHUB_OUTPUT"
              echo "go_pkg=github.com/microservices-demo/user" >> "$GITHUB_OUTPUT"
              echo "go_root=github.com/microservices-demo/user" >> "$GITHUB_OUTPUT"
              echo "context=backend/user" >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/user/Dockerfile.ci" >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "stack=node" >> "$GITHUB_OUTPUT"
              echo "context=frontend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=frontend/Dockerfile.ci" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown service $SERVICE"
              exit 1
              ;;
          esac
          echo "ecr_repo=sockshop-${SERVICE}-env-1" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PUSH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name and tag
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
          ECR_REPO: ${{ steps.svc.outputs.ecr_repo }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/${{ github.repository }}/releases" --jq \
              "[.[] | select(.tag_name | startswith(\"${SERVICE}-v\")) | .tag_name][0]" 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="$(git rev-parse --short HEAD)"
            echo "No ${SERVICE}-v* release tag found; using short SHA ${TAG}"
          else
            echo "Using tag ${TAG}"
          fi
          IMAGE_TAG="$TAG"
          prefix="${SERVICE}-"
          if [[ "$TAG" == "$prefix"* ]]; then
            IMAGE_TAG="${TAG#"$prefix"}"
          fi
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${ECR_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.svc.outputs.stack == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: backend/${{ inputs.service }}/pom.xml

      - name: Maven package
        if: steps.svc.outputs.stack == 'java'
        working-directory: backend/${{ inputs.service }}
        run: mvn -B -DskipTests package

      - uses: actions/setup-go@v5
        if: steps.svc.outputs.stack == 'go'
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/${{ inputs.service }}/go.sum

      - name: Build Go binary
        if: steps.svc.outputs.stack == 'go'
        env:
          SERVICE: ${{ inputs.service }}
          GO_PKG: ${{ steps.svc.outputs.go_pkg }}
        run: |
          set -euo pipefail
          SRC_DIR="$GITHUB_WORKSPACE/backend/${SERVICE}"
          case "$SERVICE" in
            catalogue) (cd "$SRC_DIR" && CGO_ENABLED=0 go build -o app ./cmd/cataloguesvc) ;;
            payment)   (cd "$SRC_DIR" && CGO_ENABLED=0 go build -o app ./cmd/paymentsvc) ;;
            user)      (cd "$SRC_DIR" && CGO_ENABLED=0 go build -o app .) ;;
            *) echo "unknown go service: $SERVICE"; exit 1 ;;
          esac
          ls -la "$SRC_DIR/app"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.svc.outputs.context }}
          file: ${{ steps.svc.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed image (env-1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${{ inputs.service }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.image_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Promote with **6. Copy image** (service=\`${{ inputs.service }}\`, tag=\`${{ steps.meta.outputs.tag }}\`)." >> "$GITHUB_STEP_SUMMARY"
