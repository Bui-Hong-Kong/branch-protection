# Manual: build frontend image and push to ECR env-1 only.
# Run from Actions → 5. Push image → Run workflow.
# Uses repo variable AWS_ROLE_ARN_PUSH (OIDC). Promote to env-2 via 6. Copy image.
# Does not run on PR/merge.

name: 5. Push image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (prefer Release tag e.g. v1.2.3; empty = short git SHA)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: push-image-env-1
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: branch-protection-env-1

jobs:
  push:
    name: Build and push env-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PUSH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name and tag
        id: meta
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed image (env-1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.image_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Promote to env-2 with **6. Copy image** (same tag: \`${{ steps.meta.outputs.tag }}\`)." >> "$GITHUB_STEP_SUMMARY"
