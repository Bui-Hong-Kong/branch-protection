# PR-only quality gates (all languages on every PR — no CodeQL / main-only scan).
# Job names are stable for GitHub rulesets.
#
#   Java       → Maven package + Checkstyle
#   Go         → golangci-lint + go build
#   JavaScript → ESLint + yarn/docker frontend

name: 2. Pre-merge checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_SERVICES: carts orders shipping

jobs:
  # Combined lint+build (was two jobs × full package). Keeps required name "Build (java)".
  build-java:
    name: Build (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            backend/carts/pom.xml
            backend/orders/pom.xml
            backend/shipping/pom.xml

      - name: Maven package + Checkstyle
        run: |
          set -euo pipefail
          CHECKSTYLE_CFG="$GITHUB_WORKSPACE/.github/linters/checkstyle.xml"
          for svc in $JAVA_SERVICES; do
            echo "::group::Java ${svc}"
            mvn -B -DskipTests package \
              org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check \
              -f "backend/${svc}/pom.xml" \
              -Dcheckstyle.config.location="$CHECKSTYLE_CFG" \
              -Dcheckstyle.consoleOutput=true \
              -Dcheckstyle.failsOnError=true
            echo "::endgroup::"
          done

  # Satisfies ruleset context "Lint (java)" without a second full Maven build.
  lint-java:
    name: Lint (java)
    needs: build-java
    runs-on: ubuntu-latest
    steps:
      - name: Reuse Build (java)
        run: echo "Checkstyle ran in Build (java); SpotBugs/CodeQL Java are main-only."

  lint-go:
    name: Lint (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            backend/catalogue/go.sum
            backend/payment/go.sum
            backend/user/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend/catalogue
          args: --config=${{ github.workspace }}/.golangci.yml
          # Avoid flaky fetch of remote jsonschema during config verify.
          verify: false

      - name: golangci-lint (payment)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend/payment
          args: --config=${{ github.workspace }}/.golangci.yml
          verify: false

      - name: golangci-lint (user)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: backend/user
          args: --config=${{ github.workspace }}/.golangci.yml
          verify: false

  lint-javascript:
    name: Lint (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save eslint@8.57.1
          npx eslint . --max-warnings 0

  build-javascript:
    name: Build (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Yarn install (frontend)
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Docker build frontend (verify Dockerfile.ci)
        run: |
          set -euo pipefail
          docker build -f frontend/Dockerfile.ci -t sockshop-frontend:ci frontend

  build-go:
    name: Build (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            backend/catalogue/go.sum
            backend/payment/go.sum
            backend/user/go.sum

      - name: Go build
        run: |
          set -euo pipefail
          echo "::group::catalogue"
          (cd backend/catalogue && CGO_ENABLED=0 go build -o app ./cmd/cataloguesvc)
          echo "::endgroup::"
          echo "::group::payment"
          (cd backend/payment && CGO_ENABLED=0 go build -o app ./cmd/paymentsvc)
          echo "::endgroup::"
          echo "::group::user"
          (cd backend/user && CGO_ENABLED=0 go build -o app .)
          echo "::endgroup::"
