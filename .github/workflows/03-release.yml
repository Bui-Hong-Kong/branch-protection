# Per-service semver Git tags + GitHub Releases from Conventional Commits on main.
# Tag format: <service>-vX.Y.Z (e.g. carts-v1.2.3, frontend-v1.0.0).
# Path roots defined in release/services.mjs.
# Does not commit back to main. Does not build/push images.

name: 3. Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Release only this service (empty = all)
        type: choice
        required: false
        default: all
        options:
          - all
          - carts
          - catalogue
          - orders
          - payment
          - shipping
          - user
          - frontend

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  matrix:
    name: Services to release
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          ALL='["carts","catalogue","orders","payment","shipping","user","frontend"]'
          INPUT="${{ github.event.inputs.service || 'all' }}"
          if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "services=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release (${{ matrix.service }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.matrix.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Semantic-release (${{ matrix.service }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ matrix.service }}
        run: npm run release
