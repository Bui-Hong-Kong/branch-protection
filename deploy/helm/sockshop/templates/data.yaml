{{- if .Values.data.catalogueDb.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-db
  labels:
    {{- include "sockshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalogue-db
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sockshop.selectorLabels" (dict "root" . "name" "catalogue-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sockshop.selectorLabels" (dict "root" . "name" "catalogue-db") | nindent 8 }}
    spec:
      containers:
        - name: catalogue-db
          image: {{ .Values.data.catalogueDb.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: {{ .Values.data.catalogueDb.port }}
          env:
            {{- range $k, $v := .Values.data.catalogueDb.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  labels:
    {{- include "sockshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalogue-db
spec:
  type: ClusterIP
  selector:
    {{- include "sockshop.selectorLabels" (dict "root" . "name" "catalogue-db") | nindent 4 }}
  ports:
    - name: mysql
      port: {{ .Values.data.catalogueDb.port }}
      targetPort: mysql
{{- end }}

