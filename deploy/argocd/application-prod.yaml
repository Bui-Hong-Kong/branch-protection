apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sockshop-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Bui-Hong-Kong/branch-protection.git
    targetRevision: main
    path: deploy/helm/sockshop
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sockshop-prod
  syncPolicy:
    # Manual sync recommended for prod; enable automated after you trust the pipeline.
    syncOptions:
      - CreateNamespace=false
