# golangci-lint — de-facto standard Go meta-linter.
# Conservative enable-list for Sock Shop Go services (go.mod).
run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - govet
    - typecheck

linters-settings:
  govet:
    disable:
      # Legacy Sock Shop code predates this check; signal channels already buffered.
      - sigchanyzer

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - vendor
